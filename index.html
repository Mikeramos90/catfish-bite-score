<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d2334" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Catfish Bite Score</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg-deep: #0d2334;
      --bg-card: #123249;
      --bg-elevated: #18425e;
      --border-river: #206373;
      --text-primary: #f8f1df;
      --text-secondary: #acb5b4;
      --text-muted: #7c97a0;
      --whisker-gold: #efb547;
      --whisker-bright: #f7c968;
      --river-teal: #71c2c2;
      --slack-rose: #e06d53;
      --moderate-blue: #46a3b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #184359 0%, var(--bg-deep) 65%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 12px 12px 28px;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header & Location Controls */
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.3px;
      color: var(--whisker-bright);
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-river);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--whisker-gold);
    }

    .sync-dot.live { background: var(--river-teal); box-shadow: 0 0 6px var(--river-teal); }
    .sync-dot.offline { background: var(--whisker-gold); }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    select, input[type="date"], input[type="text"] {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-river);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--whisker-gold);
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-river);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: transform 0.08s ease, border-color 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-gold {
      background: rgba(239, 181, 71, 0.14);
      border-color: rgba(239, 181, 71, 0.45);
      color: var(--whisker-bright);
    }

    .sub-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    .badge-count {
      background: rgba(239, 181, 71, 0.2);
      color: var(--whisker-bright);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
    }

    /* Hero Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-river);
      border-radius: 16px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 18px;
    }

    .header-app-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      object-fit: cover;
      border: 1.5px solid var(--whisker-gold);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .rating-stage {
      width: 100%;
      background: #0b1e2d;
      border: 1px solid var(--border-river);
      border-radius: 14px;
      padding: 12px 10px 14px;
      margin: 4px 0 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .rating-top-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rating-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--whisker-bright);
    }

    .rating-sub {
      font-size: 11px;
      font-weight: 700;
      color: var(--river-teal);
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
    }

    .hero-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
      text-align: center;
    }

    .catfish-scale-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      align-items: center;
      justify-items: center;
      min-height: 76px;
      padding: 4px 0;
    }

    .scale-catfish-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 74px;
      position: relative;
    }

    .scale-catfish-img {
      height: 64px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.55));
      transition: transform 0.22s ease, opacity 0.22s ease;
      transform-origin: center center;
    }

    /* Timeline SVG & Scrubber */
    .timeline-box {
      width: 100%;
      margin-top: 12px;
      background: #0b1e2d;
      border: 1px solid var(--border-river);
      border-radius: 12px;
      padding: 8px 8px 6px;
    }

    .timeline-svg {
      width: 100%;
      height: 76px;
      display: block;
      cursor: ew-resize;
      touch-action: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #1d4e63;
      outline: none;
      margin: 8px 0 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--whisker-bright);
      border: 3px solid #0d2334;
      box-shadow: 0 0 8px rgba(239, 181, 71, 0.6);
      cursor: pointer;
    }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .peaks-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .peak-chip {
      background: var(--bg-elevated);
      border: 1px solid var(--border-river);
      border-radius: 10px;
      padding: 7px 4px;
      text-align: center;
      cursor: pointer;
    }

    .peak-chip:hover { border-color: var(--whisker-gold); }
    .peak-time { font-size: 11px; font-weight: 800; color: var(--text-primary); }
    .peak-score { font-size: 10px; font-weight: 700; color: var(--whisker-bright); margin-top: 2px; }

    /* River Wave Strip */
    .river-wave-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 8px;
      opacity: 0.35;
      pointer-events: none;
      animation: riverFlow 7s linear infinite;
    }

    .river-wave-strip.slack {
      animation-duration: 28s;
      opacity: 0.16;
    }

    @keyframes riverFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Score Drivers */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .drivers-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .driver-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-river);
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .driver-pos {
      background: rgba(113, 194, 194, 0.11);
      border-color: rgba(113, 194, 194, 0.35);
      color: #8cd6d6;
    }

    .driver-gold {
      background: rgba(239, 181, 71, 0.13);
      border-color: rgba(239, 181, 71, 0.38);
      color: var(--whisker-bright);
    }

    .driver-neg {
      background: rgba(224, 109, 83, 0.13);
      border-color: rgba(224, 109, 83, 0.38);
      color: #f5a08c;
    }

    /* Logging Footer */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .bias-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reset-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .catch-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .qty-stepper {
      display: inline-flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid rgba(239, 181, 71, 0.4);
      border-radius: 12px;
      overflow: hidden;
      min-height: 44px;
    }

    .qty-btn {
      width: 36px;
      height: 44px;
      background: transparent;
      border: none;
      color: var(--whisker-bright);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-btn:active { background: rgba(239, 181, 71, 0.15); }

    .qty-val {
      min-width: 28px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .btn-log-bite {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(239, 181, 71, 0.24), rgba(113, 194, 194, 0.18));
      border: 1px solid rgba(239, 181, 71, 0.55);
      color: var(--whisker-bright);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-skunk {
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-river);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
