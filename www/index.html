<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Catfish Bite Score</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg-deep: #0a0f0e;
      --bg-card: #121a18;
      --bg-elevated: #182320;
      --border-river: #263632;
      --text-primary: #f1f5f3;
      --text-secondary: #9cb0a8;
      --text-muted: #687c75;
      --whisker-gold: #f59e0b;
      --whisker-bright: #fbbf24;
      --river-teal: #2dd4bf;
      --slack-rose: #f43f5e;
      --moderate-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #131f1c 0%, var(--bg-deep) 65%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 12px 12px 28px;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header & Location Controls */
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.3px;
      color: var(--whisker-bright);
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-river);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--whisker-gold);
    }

    .sync-dot.live { background: var(--river-teal); box-shadow: 0 0 6px var(--river-teal); }
    .sync-dot.offline { background: var(--whisker-gold); }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    select, input[type="date"], input[type="text"] {
      background: var(--bg-card);
