name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          fi

      - name: Install Capacitor & Sync Android Project
        run: |
          npm init -y
          npm install @capacitor/core@^6.1.2 @capacitor/cli@^6.1.2 @capacitor/android@^6.1.2
          npx cap init "Catfish Bite Score" "com.catfish.bitescore" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Apply Catfish Launcher Icons & Build Debug APK
        run: |
          pip install --break-system-packages pillow
          python3 -c '
          import glob
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (512, 512), (10, 15, 14, 255))
          d = ImageDraw.Draw(img)
          d.polygon([(210, 185), (265, 115), (305, 190)], fill=(217, 119, 6, 255))
          d.polygon([(285, 315), (225, 395), (335, 325)], fill=(217, 119, 6, 255))
          d.ellipse([115, 185, 395, 325], fill=(245, 158, 11, 255))
          d.polygon([(140, 255), (55, 175), (90, 255), (55, 335)], fill=(245, 158, 11, 255))
          d.ellipse([340, 220, 362, 242], fill=(10, 15, 14, 255))
          d.line([(380, 245), (445, 200), (480, 208)], fill=(251, 191, 36, 255), width=10)
          d.line([(385, 265), (450, 285), (485, 320)], fill=(251, 191, 36, 255), width=10)
          d.line([(360, 290), (415, 345), (435, 380)], fill=(251, 191, 36, 255), width=8)
          for path in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
            size = Image.open(path).size
            img.resize(size, Image.Resampling.LANCZOS).save(path)
          '
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            echo "Gradle hit rate limit or transient error on attempt $attempt, retrying in 20s..."
            sleep 20
          done

      - name: Upload Catfish Bite Score APK
        uses: actions/upload-artifact@v4
        with:
          name: Catfish-Bite-Score-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
