name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Capacitor Config Exists
        run: |
          if [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.catfish.bitescore",
            "appName": "Catfish Bite Score",
            "webDir": "www"
          }
          EOF
          fi

      - name: Install Capacitor & Sync Android Project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Accept SDK Licenses & Build Debug APK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Catfish Bite Score APK
        uses: actions/upload-artifact@v4
        with:
          name: Catfish-Bite-Score-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
