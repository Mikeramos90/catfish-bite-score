name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure Capacitor Project & Web App Exist
        run: |
          if [ ! -f package.json ]; then
            cat << 'EOF' > package.json
{
  "name": "catfish-bite-score",
  "version": "1.0.0",
  "dependencies": {
    "@capacitor/android": "^6.1.2",
    "@capacitor/core": "^6.1.2"
  },
  "devDependencies": {
    "@capacitor/cli": "^6.1.2"
  }
}
EOF
          fi

          if [ ! -f capacitor.config.json ]; then
            cat << 'EOF' > capacitor.config.json
{
  "appId": "com.catfish.bitescore",
  "appName": "Catfish Bite Score",
  "webDir": "www"
}
EOF
          fi

          mkdir -p www
          if [ ! -f www/index.html ]; then
            cat << 'EOF_HTML' > www/index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0f0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Catfish Bite Score</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root {
      --bg-deep: #0a0f0e;
      --bg-card: #121a18;
      --bg-elevated: #182320;
      --border-river: #263632;
      --text-primary: #f1f5f3;
      --text-secondary: #9cb0a8;
      --text-muted: #687c75;
      --whisker-gold: #f59e0b;
      --whisker-bright: #fbbf24;
      --river-teal: #2dd4bf;
      --slack-rose: #f43f5e;
      --moderate-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #131f1c 0%, var(--bg-deep) 65%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 12px 12px 28px;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Header & Location Controls */
    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.3px;
      color: var(--whisker-bright);
    }

    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border-river);
      color: var(--text-secondary);
      cursor: pointer;
    }

    .sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--whisker-gold);
    }

    .sync-dot.live { background: var(--river-teal); box-shadow: 0 0 6px var(--river-teal); }
    .sync-dot.offline { background: var(--whisker-gold); }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    select, input[type="date"], input[type="text"] {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-river);
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    select:focus, input:focus {
      border-color: var(--whisker-gold);
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-river);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      transition: transform 0.08s ease, border-color 0.15s ease;
    }

    .btn:active { transform: scale(0.97); }
    .btn-gold {
      background: rgba(245, 158, 11, 0.14);
      border-color: rgba(245, 158, 11, 0.45);
      color: var(--whisker-bright);
    }

    .sub-controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      align-items: center;
    }

    .badge-count {
      background: rgba(245, 158, 11, 0.2);
      color: var(--whisker-bright);
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
    }

    /* Hero Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-river);
      border-radius: 16px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 18px;
    }

    .gauge-wrap {
      position: relative;
      width: 188px;
      height: 188px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 2px 0 6px;
    }

    .gauge-svg {
      width: 188px;
      height: 188px;
      transform: rotate(-90deg);
    }

    .gauge-track {
      fill: none;
      stroke: #1c2925;
      stroke-width: 12;
    }

    .gauge-progress {
      fill: none;
      stroke: var(--whisker-gold);
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.35s ease, stroke 0.35s ease;
    }

    .catfish-watermark {
      position: absolute;
      width: 116px;
      height: 60px;
      opacity: 0.09;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
    }

    .gauge-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .score-num {
      font-size: 54px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -1.5px;
      color: var(--text-primary);
    }

    .tier-badge {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      color: var(--whisker-bright);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .hero-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
    }

    .hero-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 3px;
      text-align: center;
    }

    /* Timeline SVG & Scrubber */
    .timeline-box {
      width: 100%;
      margin-top: 12px;
      background: #0d1413;
      border: 1px solid var(--border-river);
      border-radius: 12px;
      padding: 8px 8px 6px;
    }

    .timeline-svg {
      width: 100%;
      height: 76px;
      display: block;
      cursor: ew-resize;
      touch-action: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #1f2e2a;
      outline: none;
      margin: 8px 0 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--whisker-bright);
      border: 3px solid #0a0f0e;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      cursor: pointer;
    }

    .axis-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 2px;
    }

    .peaks-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }

    .peak-chip {
      background: var(--bg-elevated);
      border: 1px solid var(--border-river);
      border-radius: 10px;
      padding: 7px 4px;
      text-align: center;
      cursor: pointer;
    }

    .peak-chip:hover { border-color: var(--whisker-gold); }
    .peak-time { font-size: 11px; font-weight: 800; color: var(--text-primary); }
    .peak-score { font-size: 10px; font-weight: 700; color: var(--whisker-bright); margin-top: 2px; }

    /* River Wave Strip */
    .river-wave-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 8px;
      opacity: 0.35;
      pointer-events: none;
      animation: riverFlow 7s linear infinite;
    }

    .river-wave-strip.slack {
      animation-duration: 28s;
      opacity: 0.16;
    }

    @keyframes riverFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* Score Drivers */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .drivers-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .driver-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid var(--border-river);
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .driver-pos {
      background: rgba(45, 212, 191, 0.11);
      border-color: rgba(45, 212, 191, 0.35);
      color: #5eead4;
    }

    .driver-gold {
      background: rgba(245, 158, 11, 0.13);
      border-color: rgba(245, 158, 11, 0.38);
      color: var(--whisker-bright);
    }

    .driver-neg {
      background: rgba(244, 63, 94, 0.13);
      border-color: rgba(244, 63, 94, 0.38);
      color: #fda4af;
    }

    /* Logging Footer */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .bias-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reset-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .log-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .catch-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .qty-stepper {
      display: inline-flex;
      align-items: center;
      background: var(--bg-elevated);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 12px;
      overflow: hidden;
      min-height: 44px;
    }

    .qty-btn {
      width: 36px;
      height: 44px;
      background: transparent;
      border: none;
      color: var(--whisker-bright);
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
    }

    .qty-btn:active { background: rgba(245, 158, 11, 0.15); }

    .qty-val {
      min-width: 28px;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .btn-log-bite {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.24), rgba(45, 212, 191, 0.18));
      border: 1px solid rgba(245, 158, 11, 0.55);
      color: var(--whisker-bright);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-skunk {
      width: 100%;
      min-height: 42px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-river);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .recent-logs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .log-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #0d1413;
      border: 1px solid var(--border-river);
      color: var(--text-secondary);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 7, 0.84);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 1000;
    }

    .modal-backdrop.open { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border-river);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
      color: var(--whisker-bright);
    }

    #pinMap {
      width: 100%;
      height: 230px;
      border-radius: 12px;
      border: 1px solid var(--border-river);
      background: #0d1413;
      z-index: 1;
    }

    .detect-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-river);
      color: var(--river-teal);
    }

    .pin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-river);
      border-radius: 10px;
    }

    .pin-item-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .pin-item-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pin-item-sub {
      font-size: 10px;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #182320;
      border: 1px solid var(--whisker-gold);
      color: var(--whisker-bright);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 2000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top Brand & Sync -->
    <div class="brand-bar">
      <div class="brand-title">
        <!-- Catfish Silhouette Emblem -->
        <svg width="26" height="16" viewBox="0 0 64 36" fill="none" aria-hidden="true">
          <path d="M52 18C44 9 30 7 18 11L6 4L10 18L6 32L18 25C30 29 44 27 52 18Z" fill="#f59e0b"/>
          <path d="M50 16C55 13 60 12 63 13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
          <path d="M50 20C55 23 60 24 63 23" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
          <circle cx="46" cy="15" r="1.8" fill="#0a0f0e"/>
        </svg>
        <span>Catfish Bite Score</span>
      </div>
      <button id="syncBtn" class="sync-pill" title="Refresh live feeds">
        <span id="syncDot" class="sync-dot"></span>
        <span id="syncLabel">SYNCING...</span>
      </button>
    </div>

    <!-- Location Selector & Pin Controls -->
    <div class="controls-row">
      <select id="locationSelect" aria-label="Select fishing location"></select>
      <button id="openDropPinBtn" class="btn btn-gold">📍 Drop Pin</button>
      <button id="openManagePinsBtn" class="btn">Pins <span id="pinCountBadge" class="badge-count">0</span></button>
    </div>

    <!-- Date & NOW Jump -->
    <div class="sub-controls">
      <input type="date" id="datePicker" aria-label="Select date" />
      <button id="nowBtn" class="btn">NOW</button>
      <button id="refreshBtn" class="btn" title="Refresh feeds">↻</button>
    </div>

    <!-- Hero Bite Score Card -->
    <div class="card hero-card">
      <div class="gauge-wrap">
        <!-- Catfish Watermark -->
        <svg class="catfish-watermark" viewBox="0 0 120 64" fill="none" aria-hidden="true">
          <path d="M98 32C82 14 54 10 32 18L8 6L15 32L8 58L32 46C54 54 82 50 98 32Z" fill="#fbbf24"/>
          <path d="M94 27C104 21 113 19 118 21" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
          <path d="M94 37C104 43 113 45 118 43" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        </svg>

        <svg class="gauge-svg" viewBox="0 0 188 188">
          <circle class="gauge-track" cx="94" cy="94" r="78"></circle>
          <circle id="gaugeProgress" class="gauge-progress" cx="94" cy="94" r="78"
                  stroke-dasharray="490.09" stroke-dashoffset="490.09"></circle>
        </svg>

        <div class="gauge-center">
          <div id="heroScore" class="score-num">--</div>
          <div id="heroTier" class="tier-badge">LOADING</div>
        </div>
      </div>

      <div id="heroSubtitle" class="hero-subtitle">Calculating river conditions...</div>
      <div id="heroMeta" class="hero-meta">Moon --% · Sunset --:--</div>

      <!-- 24h Interactive Timeline -->
      <div class="timeline-box">
        <svg id="timelineSvg" class="timeline-svg" viewBox="0 0 360 76" preserveAspectRatio="none"></svg>
        <input type="range" id="timeSlider" min="0" max="1435" step="5" value="720" aria-label="Time of day scrubber" />
        <div class="axis-labels">
          <span>12a</span><span>6a</span><span>12p</span><span>6p</span><span>12a</span>
        </div>
      </div>

      <!-- Top 3 Peak Windows -->
      <div id="peaksRow" class="peaks-row"></div>

      <!-- Animated River Current Wave Strip -->
      <svg id="riverWaveStrip" class="river-wave-strip" viewBox="0 0 720 12" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 6 Q 45 0, 90 6 T 180 6 T 270 6 T 360 6 T 450 6 T 540 6 T 630 6 T 720 6"
              fill="none" stroke="#2dd4bf" stroke-width="2.5" />
      </svg>
    </div>

    <!-- Score Drivers (+/- Pills) -->
    <div class="card">
      <div class="section-label">Score Drivers</div>
      <div id="driversWrap" class="drivers-wrap"></div>
    </div>

    <!-- Multi-Catch Bite Calibration Logger -->
    <div class="card">
      <div class="log-header">
        <span id="biasSummary" class="bias-text">In 1.05x · Out 0.95x (0 fish / 0 logs)</span>
        <button id="resetLogsBtn" class="reset-link">Reset logs</button>
      </div>
      <div class="log-stack">
        <div class="catch-row">
          <div class="qty-stepper">
            <button type="button" id="qtyMinusBtn" class="qty-btn" aria-label="Decrease catch count">−</button>
            <span id="catchQtyVal" class="qty-val">1</span>
 
