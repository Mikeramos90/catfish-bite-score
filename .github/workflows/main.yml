name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          fi

      - name: Install Capacitor & Sync Android Project
        run: |
          npm init -y
          npm install @capacitor/core@^6.1.2 @capacitor/cli@^6.1.2 @capacitor/android@^6.1.2
          npx cap init "Katfish Bites" "com.Katfish.bites" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Apply Custom Catfish Icon & Build Debug APK
        run: |
          pip install --break-system-packages pillow
          python3 -c '
          import glob
          from PIL import Image
          src = Image.open("app-icon.png").convert("RGBA")
          for path in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher*.png"):
            size = Image.open(path).size
            src.resize(size, Image.Resampling.LANCZOS).save(path)
          '
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x gradlew
          for attempt in 1 2 3 4; do
            if ./gradlew assembleDebug --no-daemon; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            echo "Gradle hit transient error on attempt $attempt, retrying in 20s..."
            sleep 20
          done

      - name: Upload Katfish Bites APK
        uses: actions/upload-artifact@v4
        with:
          name: Katfish-Bites-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
